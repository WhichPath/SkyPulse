name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by softprops/action-gh-release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use standard Maven repos for CI
        run: |
          # The upstream settings.gradle.kts puts Aliyun mirrors first (optimized for China).
          # On GitHub Actions (US-based runners) Aliyun can be unreachable, which breaks
          # plugin resolution (e.g. KSP plugin marker is only on Maven Central, not Google
          # Maven). Remove the Aliyun lines so CI uses google() + mavenCentral() +
          # gradlePluginPortal() directly. This is CI-only; settings.gradle.kts is not committed.
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          echo "--- settings.gradle.kts after cleanup ---"
          cat settings.gradle.kts

      - name: Generate local.properties
        run: |
          # QWeather (和风天气) JWT authentication.
          # Secrets: QWEATHER_PROJECT_ID, QWEATHER_KEY_ID, QWEATHER_PRIVATE_KEY, QWEATHER_API_HOST
          # AMap keys are optional (system location fallback if empty).
          {
            echo "QWEATHER_PROJECT_ID=${{ secrets.QWEATHER_PROJECT_ID }}"
            echo "QWEATHER_KEY_ID=${{ secrets.QWEATHER_KEY_ID }}"
            echo "QWEATHER_PRIVATE_KEY=${{ secrets.QWEATHER_PRIVATE_KEY }}"
            echo "QWEATHER_API_HOST=${{ secrets.QWEATHER_API_HOST }}"
          } > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
             "output/skypulse-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: skypulse-v${{ steps.version.outputs.version }}
          path: output/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: 修复已知问题
          files: output/*.apk
