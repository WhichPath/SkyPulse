name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use standard Maven repos for CI
        run: |
          # The upstream settings.gradle.kts puts Aliyun mirrors first (optimized for China).
          # On GitHub Actions (US-based runners) Aliyun can be unreachable, which breaks
          # plugin resolution (e.g. KSP plugin marker is only on Maven Central, not Google
          # Maven). Remove the Aliyun lines so CI uses google() + mavenCentral() +
          # gradlePluginPortal() directly. This is CI-only; settings.gradle.kts is not committed.
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          echo "--- settings.gradle.kts after cleanup ---"
          cat settings.gradle.kts

      - name: Generate local.properties
        env:
          QWEATHER_PROJECT_ID: ${{ secrets.QWEATHER_PROJECT_ID }}
          QWEATHER_KEY_ID: ${{ secrets.QWEATHER_KEY_ID }}
          QWEATHER_PRIVATE_KEY: ${{ secrets.QWEATHER_PRIVATE_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
        run: |
          python3 << 'PYEOF'
          import os
          with open('local.properties', 'w') as f:
              f.write('QWEATHER_PROJECT_ID=' + os.environ.get('QWEATHER_PROJECT_ID', '') + '\n')
              f.write('QWEATHER_KEY_ID=' + os.environ.get('QWEATHER_KEY_ID', '') + '\n')
              # PEM key may span multiple lines; escape newlines as \n for Java Properties format
              pk = os.environ.get('QWEATHER_PRIVATE_KEY', '').replace('\n', '\\n').replace('\r', '')
              f.write('QWEATHER_PRIVATE_KEY=' + pk + '\n')
              f.write('QWEATHER_API_HOST=' + os.environ.get('QWEATHER_API_HOST', '') + '\n')
          PYEOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Rename APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
             "output/skypulse-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: skypulse-v${{ steps.version.outputs.version }}
          path: output/*.apk
          if-no-files-found: error
