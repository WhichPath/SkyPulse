name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by softprops/action-gh-release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate local.properties
        run: |
          # The app keeps the upstream author's proxy by default
          # (WEATHER_BASE_URL=https://wrapper.cyapi.cn/, ALERT_BASE_URL=https://starplucker.cyapi.cn/).
          # CAIYUN_TOKEN is optional: leave the secret unset to test proxy connectivity with an
          # empty token, or set it if the proxy requires one. AMap / Xiaomi keys are intentionally
          # left empty (system location fallback; city search returns empty).
          {
            echo "CAIYUN_TOKEN=${{ secrets.CAIYUN_TOKEN }}"
          } > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
             "output/skypulse-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skypulse-v${{ steps.version.outputs.version }}
          path: output/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: 修复已知问题
          files: output/*.apk
